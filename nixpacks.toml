[phases.setup]
nixPkgs = ["nodejs_20"]
aptPkgs = ["python3", "python3-pip", "python3-dev", "tesseract-ocr", "poppler-utils"]

[phases.install]
cmds = ["npm ci", "pip3 install pymupdf pdfplumber --quiet --break-system-packages"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
